<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek-2API — 对话记录</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
:root {
  --ds-bg: #f3f4f6;
  --ds-surface: #ffffff;
  --ds-sidebar-bg: #f0f2f5;
  --ds-border: #e5e7eb;
  --ds-text: #1f2937;
  --ds-text-dim: #6b7280;
  --ds-text-lighter: #9ca3af;
  --ds-accent: #4f46e5;
  --ds-accent-light: #eef2ff;
  --ds-green: #059669;
  --ds-red: #dc2626;
  --ds-user-bg: #4f46e5;
  --ds-user-text: #ffffff;
  --ds-think-bg: #f8fafc;
  --ds-think-border: #c7d2fe;
  --ds-think-header: #4f46e5;
  --ds-hover: #f9fafb;
  --ds-shadow: 0 1px 3px rgba(0,0,0,.06);
  --ds-radius: 12px;
  --ds-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --ds-mono: 'SF Mono','Fira Code','Consolas','Menlo',monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--ds-font);
  background: var(--ds-bg);
  color: var(--ds-text);
  display: flex;
  flex-direction: column;
}

/* ─── Top bar ─── */
.topbar {
  height: 52px; background: var(--ds-surface);
  border-bottom: 1px solid var(--ds-border);
  display: flex; align-items: center; padding: 0 16px;
  gap: 12px; flex-shrink: 0; z-index: 10;
}
.topbar .logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 15px; color: var(--ds-accent);
  cursor: pointer;
}
.topbar .logo svg { width: 22px; height: 22px; }
.topbar .spacer { flex: 1; }
.topbar select, .topbar button {
  background: var(--ds-surface); color: var(--ds-text); border: 1px solid var(--ds-border);
  border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  transition: border-color .15s;
}
.topbar select:hover, .topbar button:hover { border-color: var(--ds-accent); }
.topbar .badge {
  background: var(--ds-accent-light); color: var(--ds-accent);
  padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
}

/* ─── Layout ─── */
.app-body {
  flex: 1; display: flex; overflow: hidden;
}

/* ─── Sidebar (chat list) ─── */
.sidebar {
  width: 300px; background: var(--ds-sidebar-bg);
  border-right: 1px solid var(--ds-border);
  display: flex; flex-direction: column;
  overflow: hidden; flex-shrink: 0;
  transition: width .2s;
}
.sidebar.collapsed { width: 0; border: none; }
.sidebar-header {
  padding: 14px 16px 10px; font-size: 13px; font-weight: 600;
  color: var(--ds-text-dim); letter-spacing: .02em;
  text-transform: uppercase; border-bottom: 1px solid var(--ds-border);
}
.sidebar-list {
  flex: 1; overflow-y: auto; padding: 6px 8px;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

.chat-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  transition: background .12s; margin-bottom: 2px;
}
.chat-item:hover { background: var(--ds-hover); }
.chat-item.active { background: var(--ds-accent-light); }
.chat-item .ci-icon {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, #eef2ff, #e0e7ff);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--ds-accent);
}
.chat-item .ci-body { flex: 1; min-width: 0; }
.chat-item .ci-title {
  font-size: 13px; font-weight: 500; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.chat-item .ci-meta {
  font-size: 11px; color: var(--ds-text-lighter); margin-top: 3px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.chat-item .ci-meta .tag {
  background: var(--ds-surface); padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--ds-border); font-size: 10px;
}

/* ─── Main chat area ─── */
.chat-main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--ds-bg);
}
.chat-scroll {
  flex: 1; overflow-y: auto; padding-bottom: 24px;
}
.chat-scroll::-webkit-scrollbar { width: 6px; }
.chat-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; color: var(--ds-text-dim);
  gap: 8px;
}
.empty-state svg { width: 56px; height: 56px; color: var(--ds-text-lighter); }
.empty-state h3 { font-size: 16px; color: var(--ds-text); font-weight: 500; }
.empty-state p { font-size: 13px; }

/* ─── Conversation header ─── */
.convo-head {
  padding: 24px 0 12px; text-align: center;
  border-bottom: 1px solid var(--ds-border);
  background: var(--ds-surface); margin-bottom: 8px;
}
.convo-head .ch-model {
  font-size: 14px; font-weight: 600; color: var(--ds-accent);
}
.convo-head .ch-meta {
  font-size: 12px; color: var(--ds-text-dim); margin-top: 4px;
}

/* ─── Message rows (DeepSeek style: left-aligned, top-icon) ─── */
.msg-row {
  display: flex; gap: 14px; padding: 20px 24px;
  max-width: 820px; margin: 0 auto;
  animation: msgIn .25s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }

.msg-row.user {
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; margin-top: 2px;
}
.msg-row.assistant .msg-avatar {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: #fff;
}
.msg-row.user .msg-avatar {
  background: var(--ds-user-bg);
  color: var(--ds-user-text);
}

/* Content column */
.msg-body { flex: 1; min-width: 0; }
.msg-sender {
  font-size: 13px; font-weight: 600; margin-bottom: 4px;
  color: var(--ds-text);
}
.msg-row.user .msg-sender { text-align: right; }

.msg-content {
  font-size: 14.5px; line-height: 1.75; color: var(--ds-text);
  word-break: break-word;
}
.msg-row.user .msg-content {
  background: var(--ds-user-bg); color: var(--ds-user-text);
  padding: 10px 16px; border-radius: 16px 16px 4px 16px;
  display: inline-block; max-width: 100%;
}
.msg-row.assistant .msg-content {
  /* No bubble for assistant, just plain text like DS */
}

/* ─── Thinking block (DeepSeek "深度思考" style) ─── */
.think-block {
  margin: 8px 0 12px; border: 1px solid var(--ds-think-border);
  border-radius: 10px; overflow: hidden; background: var(--ds-think-bg);
}
.think-header {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; cursor: pointer;
  font-size: 13px; color: var(--ds-think-header); font-weight: 500;
  user-select: none; transition: background .1s;
}
.think-header:hover { background: rgba(79,70,229,.04); }
.think-header .think-icon { font-size: 15px; }
.think-header .think-arrow {
  font-size: 10px; transition: transform .2s;
  margin-left: auto;
}
.think-header .think-arrow.open { transform: rotate(90deg); }
.think-header .think-label { display: flex; align-items: center; gap: 4px; }
.think-content {
  padding: 0 14px 12px; font-size: 13px; color: var(--ds-text-dim);
  line-height: 1.65; display: none;
  border-top: 1px solid var(--ds-think-border);
  padding-top: 10px; margin-top: 0;
}
.think-content.show { display: block; }

/* ─── Markdown content ─── */
.msg-content p { margin: 6px 0; }
.msg-content p:first-child { margin-top: 0; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content code {
  background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 4px;
  font-family: var(--ds-mono); font-size: 13px;
}
.msg-row.user .msg-content code {
  background: rgba(255,255,255,.2);
}
.msg-content pre {
  background: #1e1e2e; border: 1px solid var(--ds-border); border-radius: 10px;
  padding: 14px 16px; overflow-x: auto; margin: 10px 0; position: relative;
}
.msg-content pre code {
  background: none; padding: 0; font-size: 13px; line-height: 1.55;
  color: #cdd6f4;
}
.msg-content blockquote {
  border-left: 3px solid var(--ds-accent); padding-left: 14px;
  margin: 8px 0; color: var(--ds-text-dim); font-style: italic;
}
.msg-content ul, .msg-content ol { padding-left: 22px; margin: 6px 0; }
.msg-content li { margin: 3px 0; }
.msg-content h1,.msg-content h2,.msg-content h3,.msg-content h4 {
  margin: 14px 0 6px; font-weight: 600; color: var(--ds-text);
}
.msg-content h1 { font-size: 18px; } .msg-content h2 { font-size: 16px; }
.msg-content h3 { font-size: 15px; } .msg-content h4 { font-size: 14px; }
.msg-content a { color: var(--ds-accent); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content hr { border: none; border-top: 1px solid var(--ds-border); margin: 14px 0; }
.msg-content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.msg-content th, .msg-content td { border: 1px solid var(--ds-border); padding: 6px 12px; }
.msg-content th { background: var(--ds-accent-light); font-weight: 500; }
.msg-content img { max-width: 100%; border-radius: 10px; margin: 6px 0; }

/* System message */
.msg-row.system .msg-avatar {
  background: var(--ds-sidebar-bg); color: var(--ds-text-dim);
}
.msg-row.system .msg-content {
  background: var(--ds-surface); border: 1px dashed var(--ds-border);
  border-radius: 8px; padding: 8px 14px; font-size: 13px;
  color: var(--ds-text-dim); font-style: italic;
}

/* Copy button for code */
.code-copy-btn {
  position: absolute; top: 8px; right: 8px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  border-radius: 6px; padding: 3px 10px; font-size: 11px;
  color: #9ca3af; cursor: pointer; opacity: 0; transition: opacity .15s;
}
pre:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }

/* ─── Back button in conversation ─── */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--ds-text-dim); background: var(--ds-surface);
  border: 1px solid var(--ds-border); transition: all .15s;
  margin: 16px auto 0; display: flex; width: fit-content;
}
.back-btn:hover { color: var(--ds-accent); border-color: var(--ds-accent); }

/* ─── Auth overlay ─── */
.auth-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  backdrop-filter: blur(4px);
}
.auth-box {
  background: var(--ds-surface); border: 1px solid var(--ds-border);
  border-radius: 16px; padding: 28px; width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.12);
}
.auth-box h3 { margin-bottom: 8px; color: var(--ds-accent); font-size: 17px; }
.auth-box p { font-size: 13px; color: var(--ds-text-dim); margin-bottom: 16px; }
.auth-box label { display: block; font-size: 13px; color: var(--ds-text-dim); margin-bottom: 4px; }
.auth-box input {
  width: 100%; background: var(--ds-bg); color: var(--ds-text); border: 1px solid var(--ds-border);
  border-radius: 10px; padding: 10px 14px; font-size: 14px;
  margin-bottom: 14px;
}
.auth-box input:focus { outline: none; border-color: var(--ds-accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
.auth-box .btn {
  background: var(--ds-accent); color: #fff; border: none; border-radius: 10px;
  padding: 10px 24px; font-size: 14px; cursor: pointer; width: 100%;
  font-weight: 500;
}
.auth-box .btn:hover { background: #4338ca; }
.auth-box .msg { font-size: 13px; margin-top: 8px; min-height: 1.2em; }
.msg-ok { color: var(--ds-green); }
.msg-err { color: var(--ds-red); }

/* Loading */
.loading-box {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px;
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--ds-border); border-top-color: var(--ds-accent);
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-box span { font-size: 13px; color: var(--ds-text-dim); }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .sidebar { width: 0; border: none; }
  .sidebar.show-mobile { width: 100%; position: absolute; left: 0; top: 52px; bottom: 0; z-index: 9; }
  .msg-row { padding: 14px 12px; gap: 10px; }
  .msg-avatar { width: 26px; height: 26px; font-size: 11px; }
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="logo" id="logoBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    DeepSeek 对话记录
  </div>
  <div class="spacer"></div>
  <select id="chatDateSelect"><option value="">今天</option></select>
  <button id="loadChatsBtn">加载</button>
  <span class="badge" id="chatCountBadge" style="display:none"></span>
  <button id="toggleSidebar" title="切换侧栏" style="display:none">☰</button>
</div>

<!-- Main layout -->
<div class="app-body">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">对话列表</div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>

  <!-- Chat area -->
  <div class="chat-main" id="chatMain">
    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <h3>选择日期并加载对话</h3>
        <p>对话记录将以 DeepSeek 风格展示</p>
      </div>
    </div>
  </div>
</div>

<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay" style="display:none">
  <div class="auth-box">
    <h3>🔑 需要验证</h3>
    <p>此服务器已配置 API_KEY 验证，请输入密钥。</p>
    <label>API Key</label>
    <input type="password" id="authKeyInput" placeholder="输入 API Key...">
    <button class="btn" id="authSubmitBtn">确认</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function getApiKey() { return sessionStorage.getItem('adminApiKey') || ''; }
function authHeaders() {
  const key = getApiKey();
  return key ? { 'Authorization': 'Bearer ' + key } : {};
}
async function apiFetch(url, options = {}) {
  const headers = { ...authHeaders(), ...(options.headers || {}) };
  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) {
    sessionStorage.removeItem('adminApiKey');
    $('authOverlay').style.display = 'flex';
    throw new Error('unauthorized');
  }
  return res;
}

// Auth
$('authSubmitBtn').addEventListener('click', () => {
  const key = $('authKeyInput').value.trim();
  if (!key) { $('authMsg').className = 'msg msg-err'; $('authMsg').textContent = '请输入 API Key'; return; }
  sessionStorage.setItem('adminApiKey', key);
  $('authOverlay').style.display = 'none';
  $('authMsg').textContent = '';
  loadChats();
});
$('authKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmitBtn').click(); });

// Marked config
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; } catch {}
    }
    try { return hljs.highlightAuto(code).value; } catch {}
    return code;
  }
});

function renderMarkdown(text) {
  if (!text) return '';
  const html = marked.parse(text);
  return DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
}

function addCodeCopyButtons(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.code-copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.textContent = '复制';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code?.textContent || '').then(() => {
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = '复制', 1500);
      });
    });
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });
}

function extractTitle(messages) {
  for (const msg of messages) {
    if (msg.role === 'user') {
      if (typeof msg.content === 'string') return msg.content;
      if (Array.isArray(msg.content)) {
        for (const part of msg.content) {
          if (part.type === 'text') return part.text;
        }
      }
    }
  }
  return '对话';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderUserContent(msg) {
  if (typeof msg.content === 'string') return renderMarkdown(msg.content);
  if (Array.isArray(msg.content)) {
    return msg.content.map(part => {
      if (part.type === 'text') return renderMarkdown(part.text);
      if (part.type === 'image_url' && part.image_url?.url) {
        const url = part.image_url.url;
        if (url.startsWith('data:')) return `<img src="${DOMPurify.sanitize(url)}" alt="uploaded image">`;
        return `<img src="${DOMPurify.sanitize(url)}" alt="image">`;
      }
      return '';
    }).join('');
  }
  return renderMarkdown(String(msg.content || ''));
}

// Toggle thinking block
window.toggleThink = function(id, el) {
  const content = document.getElementById(id);
  const arrow = el.querySelector('.think-arrow');
  content.classList.toggle('show');
  arrow.classList.toggle('open');
};

// ─── Build sidebar items ───
function buildSidebar(chats, activeIdx) {
  const list = $('sidebarList');
  let html = '';
  for (let i = 0; i < chats.length; i++) {
    const c = chats[i];
    const title = extractTitle(c.messages || []);
    const time = c.time ? c.time.replace('T',' ').slice(11,19) : '-';
    const model = c.model || '-';
    const dur = Number(c.duration) || 0;
    const msgCount = (c.messages || []).length;
    const cls = i === activeIdx ? ' active' : '';
    html += `<div class="chat-item${cls}" data-idx="${i}">
      <div class="ci-icon">💬</div>
      <div class="ci-body">
        <div class="ci-title">${escHtml(title.slice(0,100))}</div>
        <div class="ci-meta">
          <span>${escHtml(time)}</span>
          <span class="tag">${escHtml(model)}</span>
          <span class="tag">${dur}ms</span>
          ${c.stream ? '<span class="tag">stream</span>' : ''}
          ${msgCount > 1 ? `<span class="tag">${msgCount}条</span>` : ''}
        </div>
      </div>
    </div>`;
  }
  list.innerHTML = html;

  // Bind clicks
  list.querySelectorAll('.chat-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      showConversation(idx);
    });
  });
}

// ─── Show a conversation ───
let currentChats = [];
let currentIdx = -1;

function showConversation(idx) {
  currentIdx = idx;
  const chat = currentChats[idx];
  const messages = chat.messages || [];
  const response = chat.response || '';
  const reasoning = chat.reasoning || '';
  const time = chat.time ? chat.time.replace('T',' ').slice(0,19) : '-';
  const model = chat.model || '-';

  let html = '';

  // Conversation header
  html += `<div class="convo-head">
    <div class="ch-model">${escHtml(model)}</div>
    <div class="ch-meta">${escHtml(time)} · ${Number(chat.duration) || 0}ms${chat.stream ? ' · stream' : ''}</div>
  </div>`;

  // System messages
  for (const msg of messages) {
    if (msg.role === 'system') {
      html += `<div class="msg-row system">
        <div class="msg-avatar">⚙</div>
        <div class="msg-body">
          <div class="msg-sender">System</div>
          <div class="msg-content">${escHtml(typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content))}</div>
        </div>
      </div>`;
    }
  }

  // User & assistant messages
  for (const msg of messages) {
    if (msg.role === 'user') {
      html += `<div class="msg-row user">
        <div class="msg-avatar">U</div>
        <div class="msg-body">
          <div class="msg-sender">User</div>
          <div class="msg-content">${renderUserContent(msg)}</div>
        </div>
      </div>`;
    } else if (msg.role === 'assistant') {
      const content = typeof msg.content === 'string' ? msg.content : '';
      html += `<div class="msg-row assistant">
        <div class="msg-avatar">DS</div>
        <div class="msg-body">
          <div class="msg-sender">DeepSeek</div>
          <div class="msg-content">${renderMarkdown(content)}</div>
        </div>
      </div>`;
    }
  }

  // API response + reasoning
  if (response || reasoning) {
    html += `<div class="msg-row assistant">
      <div class="msg-avatar">DS</div>
      <div class="msg-body">
        <div class="msg-sender">DeepSeek</div>
        <div class="msg-content">`;

    if (reasoning) {
      const thinkId = 'think-' + Math.random().toString(36).slice(2,8);
      html += `<div class="think-block">
        <div class="think-header" onclick="toggleThink('${thinkId}',this)">
          <span class="think-icon">💭</span>
          <span class="think-label">深度思考</span>
          <span class="think-arrow">▶</span>
        </div>
        <div class="think-content" id="${thinkId}">${renderMarkdown(reasoning)}</div>
      </div>`;
    }

    html += renderMarkdown(response);
    html += `</div></div></div>`;
  }

  // Back button
  html += `<div class="back-btn" id="backBtn">← 返回列表</div>`;

  $('chatScroll').innerHTML = html;
  addCodeCopyButtons($('chatScroll'));
  $('chatScroll').scrollTop = 0;

  // Update sidebar active state
  buildSidebar(currentChats, idx);

  // Bind back button
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', showList);

  // On mobile, hide sidebar when viewing conversation
  if (window.innerWidth <= 768) {
    $('sidebar').classList.remove('show-mobile');
  }
}

// ─── Show list (reset to empty content) ───
function showList() {
  currentIdx = -1;
  $('chatScroll').innerHTML = `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    <h3>点击左侧对话查看详情</h3>
    <p>共 ${currentChats.length} 条记录</p>
  </div>`;
  buildSidebar(currentChats, -1);
}

// ─── Load chats ───
async function loadChats() {
  const date = $('chatDateSelect').value;
  $('chatScroll').innerHTML = '<div class="loading-box"><div class="spinner"></div><span>加载中...</span></div>';
  $('sidebarList').innerHTML = '';

  try {
    const url = date ? '/admin/api/logs/chats?date=' + date + '&count=10000' : '/admin/api/logs/chats?count=10000';
    const res = await apiFetch(url);
    const data = await res.json();
    currentChats = (data.chats || []).reverse();
    currentIdx = -1;

    // Update badge
    const badge = $('chatCountBadge');
    badge.textContent = currentChats.length + ' 条';
    badge.style.display = currentChats.length > 0 ? 'inline' : 'none';

    if (currentChats.length === 0) {
      $('chatScroll').innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
        <h3>无对话记录</h3>
        <p>选择其他日期试试</p>
      </div>`;
      return;
    }

    // Build sidebar
    buildSidebar(currentChats, -1);

    // Show empty chat area with prompt
    showList();

  } catch (e) {
    $('chatScroll').innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      <h3>加载失败</h3>
      <p>${escHtml(e.message)}</p>
    </div>`;
  }
}

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (currentIdx >= 0) showList();
  }
});

// ─── Logo click → back to list ───
$('logoBtn').addEventListener('click', () => {
  if (currentIdx >= 0) showList();
  else loadChats();
});

// ─── Load log dates ───
async function loadLogDates() {
  try {
    const res = await apiFetch('/admin/api/logs/dates');
    if (!res.ok) return;
    const data = await res.json();
    const dates = data.dates || [];
    const sel = $('chatDateSelect');
    sel.innerHTML = '<option value="">今天</option>';
    dates.forEach(d => {
      const o = document.createElement('option');
      o.value = d; o.textContent = d;
      sel.appendChild(o);
    });
  } catch {}
}

$('loadChatsBtn').addEventListener('click', loadChats);

// ─── Init ───
loadLogDates();
setTimeout(loadChats, 100);
</script>
</body>
</html>
