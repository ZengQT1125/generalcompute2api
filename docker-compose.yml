# GL (General Compute) 号池代理服务 Docker Compose 编排
# 使用说明：
# 1. 复制 .env.example 到 .env，并配置 GENERALCOMPUTE2API_ADMIN_TOKEN
# 2. 运行：docker-compose up -d --build

name: generalcompute2api

services:
  generalcompute2api:
    container_name: generalcompute2api
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: generalcompute2api:latest
    ports:
      - "${GENERALCOMPUTE2API_HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      GENERALCOMPUTE2API_DATABASE_PATH: /data/generalcompute2api.db
    env_file:
      - .env
    volumes:
      - ./docker-data/generalcompute2api:/data
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/busybox",
          "wget",
          "-q",
          "-O-",
          "http://127.0.0.1:8000/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
