<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeneralCompute2API 号池管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-mono/style.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <div>
          <h1>GeneralCompute2API <span class="version-badge" id="versionBadge">...</span></h1>
          <p class="muted">一 API Key 一号池 · SQLite</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn ghost icon-btn" id="btnGithub" href="https://github.com/ZengQT1125/generalcompute2api" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button type="button" class="btn ghost" id="btnLogout">退出</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar panel">
        <div class="sidebar-head">
          <h2>网关 Key</h2>
          <button type="button" class="btn primary sm" id="btnNewKey">新建</button>
        </div>
        <ul id="keyList" class="key-list"></ul>
      </aside>

      <section class="content panel" id="poolPanel">
        <div class="empty" id="emptyState">← 选择或新建一个网关 Key</div>

        <div class="pool-view hidden" id="poolView">
          <div class="pool-header">
            <div class="pool-title-block">
              <h2 id="currentPoolTitle">—</h2>
              <p class="muted" id="currentKeyMeta"></p>
              <div class="key-reveal-row">
                <button type="button" class="btn sm ghost" id="btnToggleKey">显示 Key</button>
                <div id="keyRevealBlock" class="key-reveal hidden">
                  <code id="currentKeyValue"></code>
                  <button type="button" class="btn sm" id="btnCopyKey">复制</button>
                </div>
              </div>
            </div>

            <div class="action-toolbar">
              <div class="action-group">
                <span class="action-group-label">密钥</span>
                <div class="action-group-btns">
                  <button type="button" class="btn sm" id="btnRotateKey">轮换 Key</button>
                  <button type="button" class="btn sm danger" id="btnDeletePool">删除号池</button>
                </div>
              </div>
              <div class="action-group">
                <span class="action-group-label">数据</span>
                <div class="action-group-btns">
                  <label class="btn sm file-btn" title="导入注册生成的 config.json 凭证文件">
                    JSON 导入
                    <input type="file" id="jsonFile" accept=".json,application/json" hidden />
                  </label>
                  <button type="button" class="btn sm" id="btnExportJSON">导出 JSON</button>
                </div>
              </div>
              <div class="action-group">
                <span class="action-group-label">测号</span>
                <div class="action-group-btns">
                  <button type="button" class="btn sm primary" id="btnTestAll">测可用号</button>
                  <button type="button" class="btn sm hidden" id="btnTestMuted">测禁言号</button>
                  <button type="button" class="btn sm danger hidden" id="btnStopTest">中止测号</button>
                  <button type="button" class="btn sm danger hidden" id="btnDiscardFailed">作废失败</button>
                </div>
              </div>
            </div>
          </div>

          <div class="tabs">
            <button type="button" class="tab active" data-tab="active">可用</button>
            <button type="button" class="tab" data-tab="discarded">已作废</button>
            <button type="button" class="tab" data-tab="failed">仅看失败</button>
            <button type="button" class="tab" data-tab="all">全部</button>
          </div>

          <div class="batch-bar hidden" id="batchBar">
            <span class="batch-info">已选择 <strong id="selectedCount">0</strong> 个账号</span>
            <div class="batch-buttons">
              <button type="button" class="btn sm primary" id="btnBatchTest">批量测号</button>
              <button type="button" class="btn sm" id="btnBatchRestore">批量恢复</button>
              <button type="button" class="btn sm danger" id="btnBatchDiscard">批量作废</button>
              <button type="button" class="btn sm danger" id="btnBatchDelete">批量删除</button>
            </div>
          </div>

          <div class="pagination-bar" id="paginationBar">
            <div class="pagination-size">
              <span>每页显示：</span>
              <select id="pageSizeSelect">
                <option value="10">10 条</option>
                <option value="20" selected>20 条</option>
                <option value="50">50 条</option>
                <option value="100">100 条</option>
                <option value="all">显示全部</option>
              </select>
            </div>
            <div class="pagination-buttons">
              <button type="button" class="btn sm" id="btnPageFirst">首页</button>
              <button type="button" class="btn sm" id="btnPagePrev">上一页</button>
              <span id="pageIndicator" class="page-indicator">—</span>
              <button type="button" class="btn sm" id="btnPageNext">下一页</button>
              <button type="button" class="btn sm" id="btnPageLast">尾页</button>
            </div>
          </div>

          <div id="testProgressWrap" class="test-progress-wrap hidden">
            <div class="test-progress-track">
              <div id="testProgressFill" class="test-progress-fill"></div>
            </div>
            <span id="testProgressLabel" class="test-progress-label muted"></span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 40px; text-align: center;"><input type="checkbox" id="chkSelectAll"></th>
                  <th>#</th>
                  <th>账号</th>
                  <th>Token</th>
                  <th>池状态</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="accountBody"></tbody>
            </table>
          </div>
          <p class="muted foot" id="accountStats"></p>
        </div>
      </section>
    </main>
  </div>

  <dialog id="loginDialog" class="dialog">
    <form id="loginForm" class="dialog-card">
      <h2>登录</h2>
      <p class="muted">使用 <code>GENERALCOMPUTE2API_ADMIN_TOKEN</code></p>
      <label class="field">
        <span>管理令牌</span>
        <input type="password" id="loginToken" autocomplete="off" required />
      </label>
      <button type="submit" class="btn primary block">进入</button>
    </form>
  </dialog>

  <dialog id="newKeyDialog" class="dialog">
    <form id="newKeyForm" class="dialog-card">
      <h2>新建网关 Key</h2>
      <label class="field">
        <span>API Key（sk- 随机）</span>
        <div class="input-row">
          <input id="newKeyValue" required readonly />
          <button type="button" class="btn sm" id="btnRegenNewKey">重新生成</button>
        </div>
      </label>
      <label class="field"><span>名称</span><input id="newKeyName" /></label>
      <label class="field"><span>备注</span><input id="newKeyRemark" /></label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">创建</button>
      </div>
    </form>
  </dialog>

  <dialog id="rotateDialog" class="dialog">
    <form id="rotateForm" class="dialog-card">
      <h2>轮换 API Key</h2>
      <p class="muted">号池绑定不变，仅更换客户端使用的 Key。</p>
      <label class="field"><span>当前 Key</span><input id="rotateOld" readonly /></label>
      <label class="field">
        <span>新 Key（sk- 随机）</span>
        <div class="input-row">
          <input id="rotateNew" required readonly />
          <button type="button" class="btn sm" id="btnRegenRotateKey">重新生成</button>
        </div>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">确认轮换</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=v2.11.1"></script>
</body>
</html>
